# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

exclude: 'static/'
repos:
  # Fix end of files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - '--fix=lf'

  # Remove unused imports/variables
  - repo: https://github.com/myint/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - "--in-place"
          - "--remove-unused-variables"

  # Sort imports
  - repo: https://github.com/pycqa/isort
    rev: "6.0.1"
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Black formatting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  # nixfmt and shellcheck run as system hooks rather than from their upstream
  # pre-commit repositories: the NixOS/nixfmt hook builds from source with
  # cabal, and shellcheck-precommit runs through docker. Both tools are already
  # in the devShell (see flake.nix), so use those and keep the hooks working
  # without a Haskell toolchain or a docker daemon.
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      # SC1091 is excluded because the helpers source common.sh through a path
      # resolved at runtime, which shellcheck cannot follow.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -e SC1091
        language: system
        files: \.sh$
